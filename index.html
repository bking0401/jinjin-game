<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#d7f0cb">
<title>合成大金金</title>
<style>
  /* ============ 基础（暖黄配色） ============ */
  *{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
  html,body{height:100%;overflow:hidden;}
  body{
    display:flex;align-items:center;justify-content:center;
    background:radial-gradient(circle at 50% -10%, #f4fdf1 0%, #dcf2d0 40%, #b7e2a4 100%);
    font-family:system-ui,-apple-system,"PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;
    color:#26572c;user-select:none;-webkit-user-select:none;
  }

  /* 游戏外框：宽高由 JS 按 440:720 计算 */
  #app{
    position:relative;
    border-radius:1.1em;
    overflow:hidden;
    background:#f7fdf4;
    box-shadow:0 1.2em 3em rgba(186,146,52,.26), 0 0 0 1px rgba(255,255,255,.9) inset;
    font-size:16px;
  }
  #cv{display:block;width:100%;height:100%;touch-action:none;}

  /* ============ 顶部信息栏 ============ */
  .hud{
    position:absolute;left:0;right:0;top:0;
    display:flex;justify-content:space-between;align-items:flex-start;
    padding:.55em .6em;pointer-events:none;z-index:5;
    transition:opacity .35s ease;
  }
  .hud-left,.hud-right{display:flex;gap:.4em;align-items:flex-start;}
  .score-card{
    background:rgba(250,255,248,.88);
    border:1px solid rgba(120,185,110,.45);
    border-radius:.9em;padding:.34em .7em .4em;
    box-shadow:0 .25em .8em rgba(80,140,70,.16);
    display:flex;flex-direction:column;line-height:1.05;
  }
  .score-card .lbl{font-size:.62em;letter-spacing:.18em;color:#86a86d;font-weight:600;}
  .score-card .val{
    font-size:1.62em;font-weight:800;color:#26572c;letter-spacing:.02em;
    font-variant-numeric:tabular-nums;display:inline-block;transform-origin:left center;
  }
  .score-card .val.bump{animation:bump .28s ease-out;}
  @keyframes bump{0%{transform:scale(1)}40%{transform:scale(1.28);color:#2f8b3c}100%{transform:scale(1)}}
  .score-card .best{font-size:.6em;color:#95b47e;margin-top:.1em;}
  .score-card .best i{font-style:normal;font-weight:700;color:#2f8b3c;}

  .next-card{
    background:rgba(250,255,248,.88);
    border:1px solid rgba(120,185,110,.45);
    border-radius:.9em;padding:.3em .55em .35em;
    box-shadow:0 .25em .8em rgba(80,140,70,.16);
    display:flex;flex-direction:column;align-items:center;gap:.05em;
  }
  .next-card .lbl{font-size:.56em;letter-spacing:.14em;color:#86a86d;font-weight:700;}
  .next-card img{width:2.1em;height:2.1em;object-fit:contain;}

  .card-card{
    background:rgba(250,255,248,.88);
    border:1px solid rgba(120,185,110,.45);
    border-radius:.9em;padding:.42em .55em;
    box-shadow:0 .25em .8em rgba(80,140,70,.16);
    font-size:.95em;display:flex;align-items:center;gap:.2em;
    color:#2f8b3c;font-weight:800;
  }
  .card-card.empty{opacity:.45;filter:grayscale(.6);}

  /* 音效开关（HUD 默认不吃事件，这里单独打开） */
  .sound-btn{
    pointer-events:auto;cursor:pointer;
    width:1.95em;height:1.95em;padding:0;flex:none;
    border:1px solid rgba(120,185,110,.45);border-radius:50%;
    background:rgba(250,255,248,.88);color:#2f8b3c;
    font-size:.86em;line-height:1;
    display:flex;align-items:center;justify-content:center;
    box-shadow:0 .25em .8em rgba(80,140,70,.16);
    transition:opacity .2s, filter .2s;
  }
  .sound-btn.off{opacity:.42;filter:grayscale(.8);}

  /* ============ 覆盖页 ============ */
  .screen{
    position:absolute;inset:0;z-index:10;
    display:flex;flex-direction:column;align-items:center;justify-content:center;
    gap:1.1em;padding:1.6em;
    background:linear-gradient(180deg, rgba(240,255,235,.76), rgba(226,250,215,.86));
    backdrop-filter:blur(7px);-webkit-backdrop-filter:blur(7px);
    transition:opacity .3s ease, visibility .3s;
  }
  .screen.hidden{opacity:0;visibility:hidden;pointer-events:none;}

  .credit{
    position:absolute;left:0;right:0;bottom:1.0em;
    text-align:center;font-size:.62em;letter-spacing:.1em;
    color:rgba(78,120,72,.72);font-weight:600;
  }

  .hero{
    width:11em;height:11em;object-fit:contain;
    filter:drop-shadow(0 .8em 1.1em rgba(70,150,66,.34));
    animation:float 3.2s ease-in-out infinite;
  }
  @keyframes float{0%,100%{transform:translateY(0) rotate(-2deg)}50%{transform:translateY(-.6em) rotate(2deg)}}

  .title{
    font-size:2.5em;font-weight:900;letter-spacing:.06em;
    background:linear-gradient(180deg,#4fb356 0%,#1d6528 100%);
    -webkit-background-clip:text;background-clip:text;color:transparent;
    text-shadow:0 .085em 0 rgba(255,255,255,.92), 0 .12em .22em rgba(25,80,30,.22);
  }
  .subtitle{font-size:.86em;color:#5d9152;letter-spacing:.06em;margin-top:-.7em;}

  .btn{
    border:none;cursor:pointer;font-family:inherit;
    padding:.72em 2.6em;border-radius:2em;
    font-size:1.1em;font-weight:800;letter-spacing:.1em;
    color:#14501d;background:linear-gradient(180deg,#cdf3c2,#57bd5e);
    box-shadow:0 .45em 0 #2c8a39, 0 .8em 1.4em rgba(62,140,60,.38);
    transition:transform .1s, box-shadow .1s;
  }
  .btn:active{transform:translateY(.32em);box-shadow:0 .13em 0 #2c8a39, 0 .3em .8em rgba(62,140,60,.30);}
  .btn.ghost{
    color:#3f7a46;background:rgba(250,255,248,.94);
    box-shadow:0 0 0 1.5px rgba(120,185,110,.65), 0 .3em .8em rgba(80,140,70,.15);
    font-size:.94em;padding:.66em 2em;
  }
  .btn.orange{background:linear-gradient(180deg,#bdeeb2,#48ab50);box-shadow:0 .45em 0 #2a7a34,0 .8em 1.4em rgba(70,150,66,.34);}
  .btn:disabled{opacity:.45;pointer-events:none;}

  .hint{font-size:.72em;color:#93b082;letter-spacing:.05em;text-align:center;line-height:1.9;}

  /* 结算面板 */
  .panel{
    width:100%;max-width:19em;
    background:rgba(250,255,249,.97);
    border-radius:1.4em;padding:1.6em 1.4em 1.4em;
    box-shadow:0 1.2em 2.6em rgba(52,110,48,.24), 0 0 0 1px rgba(255,255,255,.85) inset;
    display:flex;flex-direction:column;align-items:center;gap:.55em;
    animation:popIn .34s cubic-bezier(.2,1.4,.5,1);
  }
  @keyframes popIn{from{transform:scale(.8);opacity:0}to{transform:scale(1);opacity:1}}
  .panel h2{font-size:1.35em;color:#2a7a34;letter-spacing:.14em;}
  .panel .final{
    font-size:3.2em;font-weight:900;line-height:1;color:#26572c;
    font-variant-numeric:tabular-nums;
  }
  .panel .final small{font-size:.3em;font-weight:700;color:#86a86d;margin-left:.2em;}
  .panel .bestline{font-size:.78em;color:#88a970;}
  .panel .bestline b{color:#2f8b3c;font-size:1.15em;}
  .record{
    font-size:.72em;font-weight:800;color:#2f7c38;letter-spacing:.08em;
    background:#e2f6da;border-radius:1em;padding:.28em .9em;
  }
  .record.hidden{display:none;}
  .panel .btns{display:flex;flex-direction:column;gap:.6em;width:100%;margin-top:.5em;}
  .panel .btns .btn{width:100%;}
  .panel .btns .btn.hidden{display:none;}

  /* ---- 首页次要按钮 / 继续游戏 ---- */
  .btn.hidden{display:none;}
  .btn.ghost.wide{font-size:1em;padding:.62em 2.2em;}

  /* ---- 昵称输入 ---- */
  .nickrow{display:flex;gap:.45em;width:100%;align-items:center;}
  .nickrow.hidden{display:none;}
  .nickrow input{
    flex:1;min-width:0;font-family:inherit;font-size:.86em;
    padding:.6em .9em;border-radius:1.4em;
    border:1.5px solid rgba(120,185,110,.55);
    background:rgba(252,255,250,.95);color:#14501d;outline:none;text-align:center;
    letter-spacing:.04em;
  }
  .nickrow input::placeholder{color:#9dbf9c;letter-spacing:0;}
  .nickrow input:focus{border-color:#4fa859;box-shadow:0 0 0 .2em rgba(90,180,95,.18);}
  /* .panel .btns .btn 有 width:100%，这里要写全选择器才压得回去 */
  .panel .btns .nickrow .btn{
    width:auto;flex:none;
    padding:.56em 1.15em;font-size:.78em;letter-spacing:.05em;
    color:#3f7a46;background:rgba(250,255,248,.96);
    box-shadow:0 0 0 1.5px rgba(120,185,110,.7);
  }
  .panel .btns .nickrow .btn:active{box-shadow:0 0 0 1.5px rgba(120,185,110,.9);transform:translateY(.1em);}

  /* ---- 排行榜 ---- */
  #boardScreen{z-index:20;}
  .board{width:100%;max-width:19em;}
  .board h2{font-size:1.15em;color:#2f8a3d;letter-spacing:.16em;}
  .board ol{list-style:none;width:100%;margin:.25em 0 0;padding:0;}
  .board li{
    display:flex;align-items:center;gap:.55em;
    padding:.44em .75em;border-radius:.7em;font-size:.82em;color:#2c5c33;
  }
  .board li:nth-child(odd){background:rgba(232,250,225,.72);}
  .board li .rk{
    width:1.7em;flex:none;font-weight:800;color:#83b483;
    text-align:center;font-variant-numeric:tabular-nums;
  }
  .board li.r1 .rk{color:#2f9a45;font-size:1.12em;}
  .board li.r2 .rk{color:#8fa894;font-size:1.06em;}
  .board li.r3 .rk{color:#a58a5e;font-size:1.06em;}
  .board li .nm{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
  .board li .sc{font-weight:800;font-variant-numeric:tabular-nums;color:#2f8a3d;}
  .board li.empty-tip{
    justify-content:center;color:#8fb08c;font-size:.78em;background:none;padding:1.1em 0;
  }

  /* 提示气泡 */
  .toast{
    position:absolute;left:50%;top:24%;transform:translate(-50%,-50%) scale(.9);
    background:rgba(34,84,38,.92);color:#f0fff0;
    font-size:.8em;font-weight:700;letter-spacing:.06em;
    padding:.6em 1.3em;border-radius:1.4em;
    opacity:0;pointer-events:none;z-index:8;transition:all .32s ease;
    white-space:nowrap;
  }
  .toast.show{opacity:1;transform:translate(-50%,-50%) scale(1);}

  /* 启动出错时的红条（平时隐藏） */
  #errBox{
    display:none;position:absolute;left:0;right:0;bottom:0;z-index:99;
    background:rgba(178,58,38,.95);color:#fff;
    font:12px/1.5 ui-monospace,Consolas,monospace;
    padding:.6em .8em;white-space:pre-wrap;word-break:break-all;
    max-height:40%;overflow:auto;
  }
</style>
<script>
/* 兜底：脚本在任何位置出错都显示出来，避免出现"点了没反应"却查不到原因 */
window.onerror = function (msg, src, line) {
  var box = document.getElementById('errBox');
  if (!box) return;
  box.style.display = 'block';
  box.textContent = '脚本错误：' + msg + (line ? '（第 ' + line + ' 行）' : '');
};
window.addEventListener('unhandledrejection', function (e) {
  var box = document.getElementById('errBox');
  if (!box) return;
  box.style.display = 'block';
  box.textContent = '未处理的异步错误：' + ((e.reason && e.reason.message) || e.reason);
});
</script>
</head>
<body>
<div id="app">
  <canvas id="cv"></canvas>

  <!-- ================= 顶部信息栏 ================= -->
  <div class="hud" id="hud">
    <div class="hud-left">
      <div class="score-card">
        <span class="lbl">SCORE</span>
        <span class="val" id="scoreVal">0</span>
        <span class="best">最高 <i id="bestVal">0</i></span>
      </div>
    </div>
    <div class="hud-right">
      <div class="next-card">
        <span class="lbl">NEXT</span>
        <img id="nextImg" alt="">
      </div>
      <div class="card-card empty" id="cardCard">
        <span>🎫</span><b id="cardNum">0</b>
      </div>
      <button class="sound-btn" id="btnSound" title="音效开关">🔊</button>
    </div>
  </div>

  <!-- ================= 开始页 ================= -->
  <div class="screen" id="startScreen">
    <img class="hero" id="heroImg" alt="大金金">
    <div class="title">合成大金金</div>
    <div class="subtitle">把金金们叠成一只大金金</div>
    <button class="btn ghost wide hidden" id="btnResume">继 续 上 一 局</button>
    <button class="btn" id="btnStart">开 始 游 戏</button>
    <button class="btn ghost" id="btnBoard">排 行 榜</button>
    <div class="hint">
      移动鼠标 / 滑动屏幕 瞄准落点<br>
      点击或松手，金金就会掉下来
    </div>
    <div class="credit">感谢天赐为本游戏提供创作资源</div>
  </div>

  <!-- ================= 结算弹窗 ================= -->
  <div class="screen hidden" id="overScreen">
    <div class="panel">
      <h2>游戏结束</h2>
      <div class="final"><span id="finalScore">0</span><small>分</small></div>
      <div class="bestline">历史最高 <b id="finalBest">0</b></div>
      <div class="record hidden" id="newRecord">🎉 新纪录！</div>
      <div class="btns">
        <div class="nickrow" id="nickRow">
          <input id="nickInput" maxlength="12" placeholder="输入昵称，记入排行榜">
          <button class="btn" id="btnSubmit">上 榜</button>
        </div>
        <button class="btn orange" id="btnRevive">使用复活卡继续</button>
        <button class="btn" id="btnRestart">再 来 一 局</button>
        <button class="btn ghost" id="btnBoard2">查 看 排 行 榜</button>
      </div>
    </div>
  </div>

  <!-- ================= 排行榜 ================= -->
  <div class="screen hidden" id="boardScreen">
    <div class="panel board">
      <h2>排 行 榜</h2>
      <ol id="boardList"></ol>
      <div class="btns">
        <button class="btn" id="btnBoardClose">关 闭</button>
      </div>
    </div>
  </div>

  <div class="toast" id="toast"></div>
  <div id="errBox"></div>
</div>

<script>
/* ==========================================================================
   合成大金金  —  单文件 HTML5 合成游戏
   物理：Matter.js  绘制：原生 Canvas 2D
   ========================================================================== */

/* --------------------------------------------------------------------------
   ①  可调参数区（想改手感、难度，基本只动这里）
   -------------------------------------------------------------------------- */
const CFG = {
  W: 440,               // 逻辑画布宽（勿改，代码按 440x720 适配）
  H: 720,               // 逻辑画布高
  pad: 12,              // 左右墙内缩，金金不会贴到屏幕边缘
  lineY: 158,           // 警戒线高度：金金顶部越过这条线并停留会被判负
  dropY: 104,            // 待投放金金的中心高度（贴图放大后要适当上移，否则脚会压在警戒线上）
  gravity: 1.05,        // 重力大小（越大落得越快）
  overSeconds: 1.4,     // 越过警戒线持续多少秒算失败
  cooldown: 0.30,       // 两次投放之间的冷却（秒）
  cardPer: 2000,        // 每达到这么多分送一张复活卡
  maxSpeed: 26,         // 速度上限，防止高速穿模
  groundY: 690,         // 地面高度（下面留出草地，金金的脚才不会被屏幕切掉）
  spawnPool: [1,1,1,1, 2,2,2, 3,3, 4],  // 投放池：数字=等级，重复=概率（十级版本不必改）
  // ★ 人像贴图按正方形裁（只保留头肩），比例由 spriteAspect 控制，改成竖版也能用。
  // spriteW      = 贴图画出来的宽度 / 碰撞圆直径（1.12 = 略微压过碰撞圆，堆起来才不散）
  // spriteAspect = 贴图的高宽比（素材统一裁成 1:1.2 出来的）
  // spriteInner = 贴图内容占贴图方块内区的比例（跟 makeSprite 里的 pad 联动）
  spriteW: 1.12,        // 图形直径 = 2.05r，比碰撞直径多 2.4%：刚好贴住、又不互相插进去
  spriteAspect: 1.0,
  spriteInner: 384 / 420,
  sfxFromLevel: 1,      // 1 = 从第一次合成（合出第 2 级）就响；调大就是晚点才响
  lockRotation: false,  // 不锁朝向：人像会跟着翻滚，配圆形裁边之后看起来像一颗颗球在转
};

const VIS_TOP = CFG.spriteW * CFG.spriteAspect * CFG.spriteInner;

/* --------------------------------------------------------------------------
   ⑥  图片预加载 + 生成"白描边"贴图
   -------------------------------------------------------------------------- */
function makeSprite(img){
  // 把图片画到离屏 canvas，并加一圈柔和的白色描边（先把轮廓的阴影铺两次）
  // 注意：人像贴图是竖版，离屏画布也要跟着竖，否则会被压扁
  const pad = 18;
  const S = 384;                                  // 内区宽度
  const SW = S + pad * 2;                         // 画布宽
  const SH = Math.round(SW * CFG.spriteAspect);   // 画布高（按比例）
  const IH = Math.round(S * CFG.spriteAspect);    // 图片高
  const c = document.createElement('canvas');
  c.width = SW;
  c.height = SH;
  const g = c.getContext('2d');
  const oy = Math.round((SH - IH) / 2);       // 垂直居中，左右各留 pad
  g.save();
  // 只在照片自己的矩形范围内画白色描边。
  // 人像是"头肩方图"，底边就是照片的硬切边，不裁剪的话白色光晕会从底边往下漏，
  // 在游戏里看起来就是脸下面横着一条白条（贴图放大后特别明显）。
  g.beginPath();
  g.rect(pad, oy, S, IH);
  g.clip();
  g.shadowColor = 'rgba(255,255,255,1)';
  g.shadowBlur = 16;
  g.drawImage(img, pad, oy, S, IH);
  g.drawImage(img, pad, oy, S, IH);
  g.restore();
  g.drawImage(img, pad, oy, S, IH);  // 本体最后画，盖住阴影内溢

  // 方形照片裁成圆形 + 边缘柔化：
  // ① 去掉照片的四条硬直边（贴图放大后特别明显）
  // ② 两颗球叠在一起时是"圆压圆"，不再出现方块压方块那种穿模感
  // 前提：spriteAspect = 1.0，也就是图是正方形，圆正好内切
  g.globalCompositeOperation = 'destination-in';
  const cx = pad + S / 2, cy = oy + IH / 2;
  const rg = g.createRadialGradient(cx, cy, S * 0.42, cx, cy, S * 0.5);
  rg.addColorStop(0, 'rgba(0,0,0,1)');
  rg.addColorStop(0.82, 'rgba(0,0,0,1)');
  rg.addColorStop(1, 'rgba(0,0,0,0)');
  g.fillStyle = rg;
  g.fillRect(0, 0, SW, SH);
  g.globalCompositeOperation = 'source-over';
  return c;
}

// 图片是内嵌的 base64，正常几十毫秒就能解码完。
// 这里仍然给每一张加 2.5 秒超时兜底，保证任何一张出问题都不会把启动流程卡死。
function loadImages(){
  return new Promise(resolve => {
    const list = new Array(FRUIT_SRC.length).fill(null);
    let left = FRUIT_SRC.length;
    if (left === 0){ sprites = []; resolve(); return; }

    FRUIT_SRC.forEach((src, i) => {
      const im = new Image();
      let settled = false;
      const finish = ok => {
        if (settled) return;
        settled = true;
        list[i] = ok ? im : null;
        if (--left === 0){
          sprites = list.map(x => x ? makeSprite(x) : null);
          resolve();
        }
      };
      im.onload = () => finish(true);
      im.onerror = () => finish(false);
      im.src = src;
      setTimeout(() => finish(im.complete && im.naturalWidth > 0), 2500);
    });
  });
}

/* --------------------------------------------------------------------------
   ⑦  物理世界
   -------------------------------------------------------------------------- */
function createWorld(){
  engine = Matter.Engine.create();
  engine.gravity.y = CFG.gravity;
  engine.positionIterations = 8;
  engine.velocityIterations = 6;
  world = engine.world;

  const opt = { isStatic:true, friction:.5, restitution:.05 };
  const t = 60;
  const left  = Matter.Bodies.rectangle(CFG.pad - t/2, CFG.H/2, t, CFG.H*2, opt);
  const right = Matter.Bodies.rectangle(CFG.W - CFG.pad + t/2, CFG.H/2, t, CFG.H*2, opt);
  const floor = Matter.Bodies.rectangle(CFG.W/2, CFG.groundY + t/2, CFG.W*2, t, opt);
  Matter.Composite.add(world, [left, right, floor]);

  // 碰撞回调：只负责"登记"要合成的配对，真正合并放到物理步之后做
  Matter.Events.on(engine, 'collisionStart', evt => {
    for (const pair of evt.pairs){
      const a = pair.bodyA, b = pair.bodyB;

      // ---- Q 弹第一步：按撞击力度沿法线方向压扁 ----
      const nrm = pair.collision && pair.collision.normal;
      if (nrm){
        const va = a.velocity || { x:0, y:0 }, vb = b.velocity || { x:0, y:0 };
        const rel = Math.hypot(va.x - vb.x, va.y - vb.y);
        const k = Math.min(1, rel / 7);
        if (k > .05){
          const ang = Math.atan2(nrm.y, nrm.x);
          const amt = Math.min(.38, .10 + k * .30);
          if (a.isFrog){ a.squash = amt; a.squashV = 0; a.squashAng = ang; }
          if (b.isFrog){ b.squash = amt; b.squashV = 0; b.squashAng = ang; }
        }
      }

      if (!a.isFrog || !b.isFrog) continue;
      if (a.dead || b.dead || a.merging || b.merging) continue;
      if (a.level !== b.level) continue;
      a.merging = b.merging = true;
      mergeQueue.push([a, b]);
    }
  });
}

function spawnFruit(level, x, y){
  const info = FRUITS[level-1];
  const body = Matter.Bodies.circle(x, y, info.r, {
    restitution: .32,        // 撞一下会弹起来一下，堆叠仍然稳
    friction: .5,
    frictionStatic: .85,
    frictionAir: .004,
    density: .0012,
    slop: .03,
  });
  // 锁定旋转：人形金金一旦横躺会很难看，锁死后永远是正立的玩偶。
  // 把 CFG.lockRotation 改成 false 就能看到它们翻滚的样子。
  if (CFG.lockRotation) Matter.Body.setInertia(body, Infinity);
  body.isFrog = true;
  body.level = level;
  body.r = info.r;
  body.merging = false;
  body.dead = false;
  body.pop = 0;        // 0→1 的弹出动画进度
  body.squash = 0;     // Q 弹形变量：正=沿法线压扁
  body.squashV = 0;    // 形变速度（弹簧用）
  body.squashAng = 0;  // 形变轴（碰撞法线角度）
  body.age = 0;
  body.armed = false;  // 是否已落过警戒线（免疫解除）
  body.overAcc = 0;    // 越线累计时间
  Matter.Composite.add(world, body);
  fruits.set(body.id, body);
  return body;
}

function removeFruit(body){
  if (!body || body.dead) return;
  body.dead = true;
  fruits.delete(body.id);
  Matter.Composite.remove(world, body);
}

const SFX_STEP = 1.2;              // 每升一级，音高和响度各乘多少
const SFX_ANCHOR = 1;              // 原调对应的等级（改 2 就是"第一次合成用原调"）
const SFX_MAX_RATE = 2.5;          // 音高倍率上限
const SFX_MAX_LOUD = 1.6;          // 响度上限（相对第 1 级）
const SFX_BASE_GAIN = .66;         // 第 1 级的播放增益
let sfxOn = Store.get('jinjin_sfx', '1') !== '0';
let sfxCtx = null;   // AudioContext
let sfxBus = null;   // 总输出（过一级压限，防止连击时多个音叠在一起破音）
let sfxBuf = null;   // 解码后的音频数据
let sfxReq = false;  // 是否正在解码
let sfxTailBuf = {}; // 等级 -> 拉长版 AudioBuffer
let sfxTailReq = {}; // 等级 -> 是否已发起解码

// base64 → ArrayBuffer（不用 fetch，避开部分环境对 data: 的限制）
function b64ToBuffer(b64){
  const bin = atob(b64);
  const u8 = new Uint8Array(bin.length);
  for (let i = 0; i < bin.length; i++) u8[i] = bin.charCodeAt(i);
  return u8.buffer;
}

// 解码一段 base64 音频；onDone(buf) 拿结果，失败就当没有（静音降级）
function decodeB64(b64, onDone){
  try{
    // 老 Safari 只认回调，新浏览器返回 Promise，两边都接上
    const p = sfxCtx.decodeAudioData(b64ToBuffer(b64), onDone, function(){});
    if (p && p.then) p.then(onDone).catch(function(){});
  }catch(e){}
}

function loadSfxBuffer(){
  if (!sfxCtx) return;
  if (!sfxBuf && !sfxReq){
    sfxReq = true;
    decodeB64(AUDIO_B64, function(b){ sfxBuf = b; });
  }
  // 拉长版四个一起解，反正总共不到 100 KB
  for (const k in SFX_TAIL_B64){
    const lv = +k;
    if (sfxTailBuf[lv] || sfxTailReq[lv]) continue;
    sfxTailReq[lv] = true;
    (function(lv2){
      decodeB64(SFX_TAIL_B64[lv2], function(b){ sfxTailBuf[lv2] = b; });
    })(lv);
  }
}

function initSfx(){
  if (!sfxCtx){
    try{
      const AC = window.AudioContext || window.webkitAudioContext;
      if (!AC) return;                           // 环境不支持就静音降级
      sfxCtx = new AC();
    }catch(e){ sfxCtx = null; return; }
  }
  if (sfxCtx.state === 'suspended'){ try{ sfxCtx.resume(); }catch(e){} }

  // 总线上挂一个压限器：连击时几个音会叠在一起，不压一下会爆
  if (!sfxBus){
    try{
      sfxBus = sfxCtx.createGain();
      const comp = sfxCtx.createDynamicsCompressor();
      comp.threshold.value = -6;
      comp.knee.value = 6;
      comp.ratio.value = 12;
      comp.attack.value = .004;
      comp.release.value = .25;
      sfxBus.connect(comp);
      comp.connect(sfxCtx.destination);
    }catch(e){ sfxBus = null; }
  }
  loadSfxBuffer();                               // 提前解码，等真的用到时早就好了
}

// level：合成出来的等级。第 SFX_ANCHOR 级是原调原响度，往上每级音高、响度各 ×SFX_STEP
function playMergeSfx(level){
  if (!sfxOn) return;
  initSfx();
  if (!sfxCtx || !sfxBus) return;

  const lv = level | 0;
  const step = Math.max(0, lv - SFX_ANCHOR);
  const f = Math.pow(SFX_STEP, step);            // 累乘因子 1.2^step
  const rate = Math.min(SFX_MAX_RATE, f);        // 音高封顶 2.5
  const loud = Math.min(SFX_MAX_LOUD, f);        // 响度封顶 1.6

  // 最后 4 级用拉长版：音高和时长都已经烘进文件里了，按原速播
  const tail = (lv >= SFX_TAIL_FROM) ? sfxTailBuf[lv] : null;
  const buf = tail || sfxBuf;
  if (!buf) return;

  try{
    const src = sfxCtx.createBufferSource();
    const gain = sfxCtx.createGain();
    src.buffer = buf;
    src.playbackRate.value = tail ? 1 : rate;
    gain.gain.value = SFX_BASE_GAIN * loud;
    src.connect(gain);
    gain.connect(sfxBus);                        // 统一走压限总线
    src.start(0);                                // 每响一次新建一个 source，可重叠
  }catch(e){}
}

function setSfxOn(on){
  sfxOn = on;
  Store.set('jinjin_sfx', on ? '1' : '0');
  const btn = document.getElementById('btnSound');
  if (btn){
    btn.textContent = on ? '🔊' : '🔇';
    btn.classList.toggle('off', !on);
  }
  // 关掉时直接挂起整个音频上下文，正在响的也会立刻停
  if (sfxCtx){
    try{ on ? sfxCtx.resume() : sfxCtx.suspend(); }catch(e){}
  }
}

function handleMerge(a, b){
  if (!fruits.has(a.id) || !fruits.has(b.id)) return;

  const lvl = a.level;
  const mx = (a.position.x + b.position.x) / 2;
  const my = (a.position.y + b.position.y) / 2;
  const vx = (a.velocity.x + b.velocity.x) * .4;
  const vy = (a.velocity.y + b.velocity.y) * .4;

  removeFruit(a);
  removeFruit(b);

  // 最高级相撞：直接消除，加最高分
  if (lvl >= MAX_LEVEL){
    addScore(TOP_SCORE);
    addPopup(mx, my, '+' + TOP_SCORE, '#f0d24a');
    addBurst(mx, my, '#c8f0a0', 26, 1.8);
    addBurst(mx, my, '#e6fbdd', 14, 1.2);
    playMergeSfx(MAX_LEVEL);
    saveGame();
    return;
  }

  // 常规合成：升一级
  const nl = lvl + 1;
  if (nl >= CFG.sfxFromLevel) playMergeSfx(nl);   // 从第 1 级起就有声音，越往上调越高
  const nb = spawnFruit(nl, clamp(mx, CFG.pad + FRUITS[nl-1].r, CFG.W - CFG.pad - FRUITS[nl-1].r), my);
  Matter.Body.setVelocity(nb, { x:vx, y: vy - 1.6 });
  addScore(FRUITS[nl-1].score);
  addPopup(mx, my, '+' + FRUITS[nl-1].score, FRUITS[nl-1].color);
  addBurst(mx, my, FRUITS[nl-1].color, 12, 1);
  saveGame();
}

/* --------------------------------------------------------------------------
   ⑨  分数 / 复活卡
   -------------------------------------------------------------------------- */
const scoreEl = document.getElementById('scoreVal');
const bestEl = document.getElementById('bestVal');
const cardNumEl = document.getElementById('cardNum');
const cardCardEl = document.getElementById('cardCard');

function addScore(n){
  score += n;
  scoreEl.textContent = score;
  scoreEl.classList.remove('bump');
  void scoreEl.offsetWidth;   // 重启动画
  scoreEl.classList.add('bump');

  // 历史最高分实时刷新并落盘
  if (score > best){
    best = score;
    bestEl.textContent = best;
    Store.set('jinjin_best', best);
  }

  // 每跨过一个 cardPer 的整数倍，送一张复活卡
  const target = Math.floor(score / CFG.cardPer);
  while (cardsEarned < target){
    cardsEarned++;
    showToast('🎫 获得一张复活卡！');
  }
  refreshCardUI();
}

function refreshCardUI(){
  const left = Math.max(0, cardsEarned - cardsUsed);
  cardNumEl.textContent = left;
  cardCardEl.classList.toggle('empty', left <= 0);
}

/* --------------------------------------------------------------------------
   ⑩  投放
   -------------------------------------------------------------------------- */
function randLevel(){ return pick(CFG.spawnPool); }

function setAim(clientX){
  const rect = cv.getBoundingClientRect();
  const x = (clientX - rect.left) / rect.width * CFG.W;
  const r = FRUITS[holdLevel-1].r;
  aimX = clamp(x, CFG.pad + r, CFG.W - CFG.pad - r);
}

function drop(){
  if (state !== 'playing' || dropCD > 0) return;
  const b = spawnFruit(holdLevel, aimX, CFG.dropY);
  Matter.Body.setVelocity(b, { x:0, y:2.2 });
  b.pop = 1;   // 投放的金金不用弹出动画
  holdLevel = nextLevel;
  nextLevel = randLevel();
  dropCD = CFG.cooldown;
  refreshNext();
  saveGame();
  addBurst(aimX, CFG.dropY + FRUITS[holdLevel-1].r * .4, '#cfe9d8', 5, .5);
}

const nextImg = document.getElementById('nextImg');
function refreshNext(){
  nextImg.src = FRUIT_SRC[nextLevel-1];
}

/* --------------------------------------------------------------------------
   ⑪  每帧物理之后的处理：合成、越线判定、限速
   -------------------------------------------------------------------------- */
function afterPhysics(dt){
  // 1) 处理合成
  while (mergeQueue.length){
    const [a, b] = mergeQueue.shift();
    handleMerge(a, b);
  }

  // 2) 限速（防高速穿模）+ 越线判定
  const now = performance.now();
  const safe = now < safeUntil;
  let over = false;

  for (const b of fruits.values()){
    const sp = Math.hypot(b.velocity.x, b.velocity.y);
    if (sp > CFG.maxSpeed){
      Matter.Body.setVelocity(b, {
        x: b.velocity.x * CFG.maxSpeed / sp,
        y: b.velocity.y * CFG.maxSpeed / sp,
      });
    }

    b.age += dt;
    if (b.pop < 1) b.pop = Math.min(1, b.pop + dt * 5.5);

    // Q 弹第二步：欠阻尼弹簧，压下去回弹过冲、再收住，抖两下才停
    if (b.squash !== 0 || b.squashV !== 0){
      b.squashV += (-b.squash * 300 - b.squashV * 13) * dt;
      b.squash += b.squashV * dt;
      if (Math.abs(b.squash) < .003 && Math.abs(b.squashV) < .05){
        b.squash = 0; b.squashV = 0;
      }
    }

    // 用"看得见的顶端"判定，而不是碰撞圆顶端：贴图比碰撞圆高，用 b.r 会让玩家觉得判负莫名其妙
    const top = b.position.y - b.r * VIS_TOP;
    // 免疫：刚投放/刚合成的金金要先"落到线下"或超过 2.5 秒才参与判定
    if (!b.armed && (top > CFG.lineY - 2 || b.age > 2.5)) b.armed = true;

    if (b.armed && top < CFG.lineY){
      b.overAcc += dt;
      over = true;
      if (!safe && b.overAcc > CFG.overSeconds){
        triggerGameOver();
        return;
      }
    } else {
      b.overAcc = Math.max(0, b.overAcc - dt * 3);
    }
  }
  dangerFlag = over;
}

let dangerFlag = false;

/* --------------------------------------------------------------------------
   ⑫  失败 / 复活 / 重开
   -------------------------------------------------------------------------- */
const overScreen = document.getElementById('overScreen');
const finalScoreEl = document.getElementById('finalScore');
const finalBestEl = document.getElementById('finalBest');
const newRecordEl = document.getElementById('newRecord');
const btnRevive = document.getElementById('btnRevive');

function triggerGameOver(){
  if (state !== 'playing') return;
  state = 'over';
  clearSave();          // 这一局结束了，存档作废（用了复活卡会重新写一份）

  isNewRecord = score > bestAtStart;   // 本局是否刷新了历史记录
  bestEl.textContent = best;

  finalScoreEl.textContent = score;
  finalBestEl.textContent = best;
  newRecordEl.classList.toggle('hidden', !isNewRecord);

  const left = Math.max(0, cardsEarned - cardsUsed);
  btnRevive.textContent = '使用复活卡继续（剩 ' + left + '）';
  btnRevive.classList.toggle('hidden', left <= 0);

  submittedThisRound = false;

  // 每次结算都把昵称输入露出来，预填上次用过的名字
  const nr = document.getElementById('nickRow');
  const inp = document.getElementById('nickInput');
  if (nr) nr.classList.remove('hidden');
  if (inp){
    inp.disabled = false;
    inp.value = Store.get(NICK_KEY, '');
  }

  overScreen.classList.remove('hidden');
}

function revive(){
  if (state !== 'over') return;
  if (cardsEarned - cardsUsed <= 0) return;
  cardsUsed++;
  refreshCardUI();

  // 消除所有越过警戒线的金金（这种方式消除不得分）
  const doomed = [];
  for (const b of fruits.values()){
    if (b.position.y - b.r * VIS_TOP < CFG.lineY + 26) doomed.push(b);
  }
  doomed.sort((x, y) => (x.position.y - x.r * VIS_TOP) - (y.position.y - y.r * VIS_TOP));
  for (const b of doomed.slice(0, 40)){
    addBurst(b.position.x, b.position.y, FRUITS[b.level-1].color, 8, .9);
    removeFruit(b);
  }

  // 剩下的金金重置计时，并给一段保护期让堆叠稳定
  for (const b of fruits.values()){
    b.overAcc = 0;
    b.armed = false;
    b.age = 0;
  }
  safeUntil = performance.now() + 1600;
  state = 'playing';
  overScreen.classList.add('hidden');
}

/* --------------------------------------------------------------------------
   存档：关掉页面再回来能接着玩
   -------------------------------------------------------------------------- */
const SAVE_KEY = 'jinjin_save_v1';
let lastSaveAt = 0;

function saveGame(force){
  if (state !== 'playing' || !world) return;
  const now = Date.now();
  if (!force && now - lastSaveAt < 600) return;   // 合成会连着触发，别每次都写盘
  lastSaveAt = now;
  try{
    const balls = [];
    for (const b of fruits.values()){
      balls.push([
        b.level,
        Math.round(b.position.x * 10) / 10,
        Math.round(b.position.y * 10) / 10,
        Math.round(b.angle * 1000) / 1000,
        b.armed ? 1 : 0,
      ]);
    }
    Store.set(SAVE_KEY, JSON.stringify({
      v: 1,
      score: score,
      cardsEarned: cardsEarned,
      cardsUsed: cardsUsed,
      holdLevel: holdLevel,
      nextLevel: nextLevel,
      bestAtStart: bestAtStart,
      balls: balls,
      ts: Date.now(),
    }));
  }catch(e){}
}

function readSave(){
  try{
    const raw = Store.get(SAVE_KEY, '');
    if (!raw) return null;
    const d = JSON.parse(raw);
    if (!d || d.v !== 1 || !Array.isArray(d.balls) || d.balls.length === 0) return null;
    return d;
  }catch(e){ return null; }
}

function clearSave(){ Store.remove(SAVE_KEY); }

function refreshResumeBtn(){
  const btn = document.getElementById('btnResume');
  if (!btn) return;
  const d = readSave();
  if (d && d.balls.length){
    btn.classList.remove('hidden');
    btn.textContent = '继 续 上 一 局 · ' + (d.score | 0) + ' 分';
  } else {
    btn.classList.add('hidden');
  }
}

function resumeGame(d){
  if (!d) return;
  resetGame();          // 先清场
  score = d.score | 0;
  cardsEarned = d.cardsEarned | 0;
  cardsUsed = d.cardsUsed | 0;
  holdLevel = clamp(d.holdLevel | 0, 1, MAX_LEVEL);
  nextLevel = clamp(d.nextLevel | 0, 1, MAX_LEVEL);
  bestAtStart = d.bestAtStart | 0;

  for (const p of d.balls){
    const lv = clamp(p[0] | 0, 1, MAX_LEVEL);
    const b = spawnFruit(lv, p[1], p[2]);
    Matter.Body.setAngle(b, p[3] || 0);
    Matter.Body.setVelocity(b, { x:0, y:0 });
    b.pop = 1;
    b.age = 99;
    b.armed = !!p[4];
  }

  scoreEl.textContent = score;
  bestEl.textContent = best;
  refreshCardUI();
  refreshNext();
  aimX = CFG.W / 2;
  safeUntil = performance.now() + 900;
  state = 'playing';
  saveGame();
}

function getBoard(){

function addBoardEntry(name, s){

function escHtml(s){
  return String(s).replace(/[&<>"']/g, function(c){
    return { '&':'&amp;', '<':'&lt;', '>':'&gt;', '"':'&quot;', "'":'&#39;' }[c];
  });
}

function renderBoard(){

  if (!list.length){

      '<li class="r' + (i + 1) + '">' +

        '<span class="sc">' + list[i].s + '</span>' +
      '</li>'
    );
  }
  ol.innerHTML = out.join('');
}

function resetGame(){
  // 只清金金，保留静态墙体
  Matter.Composite.clear(world, true);
  fruits.clear();
  mergeQueue.length = 0;
  particles.length = 0;
  popups.length = 0;

  score = 0;
  bestAtStart = best;      // 记录开局时的历史最高分
  cardsEarned = 0;
  cardsUsed = 0;
  holdLevel = randLevel();
  nextLevel = randLevel();
  aimX = CFG.W / 2;
  dropCD = 0;
  safeUntil = performance.now() + 600;

  clearSave();             // 新开一局，旧存档作废

/* --------------------------------------------------------------------------
   ⑭  特效：粒子 & 飘字
   -------------------------------------------------------------------------- */
function addBurst(x, y, color, n, power){
  for (let i = 0; i < n; i++){
    const a = Math.random() * Math.PI * 2;
    const s = (1.2 + Math.random() * 3) * (power || 1);
    particles.push({
      x, y,
      vx: Math.cos(a) * s,
      vy: Math.sin(a) * s - 1.2,
      life: 1,
      r: 1.6 + Math.random() * 3.2,
      color,
    });
  }
}

function addPopup(x, y, text, color){
  popups.push({ x, y, text, color, life: 1 });
}

function updateEffects(dt){
  for (let i = particles.length - 1; i >= 0; i--){
    const p = particles[i];
    p.x += p.vx;
    p.y += p.vy;
    p.vy += 0.22;
    p.vx *= 0.98;
    p.life -= dt * 2.1;
    if (p.life <= 0) particles.splice(i, 1);
  }
  for (let i = popups.length - 1; i >= 0; i--){
    const t = popups[i];
    t.y -= 34 * dt;
    t.life -= dt * 1.25;
    if (t.life <= 0) popups.splice(i, 1);
  }
}

/* --------------------------------------------------------------------------
   ⑮  绘制
   -------------------------------------------------------------------------- */
function roundRect(c, x, y, w, h, r){
  c.beginPath();
  c.moveTo(x + r, y);
  c.arcTo(x + w, y, x + w, y + h, r);
  c.arcTo(x + w, y + h, x, y + h, r);
  c.arcTo(x, y + h, x, y, r);
  c.arcTo(x, y, x + w, y, r);
  c.closePath();
}

function drawBackground(){
  const g = ctx.createLinearGradient(0, 0, 0, CFG.H);
  g.addColorStop(0, '#f2fbef');
  g.addColorStop(.5, '#f6fdf3');
  g.addColorStop(1, '#d6f0c9');
  ctx.fillStyle = g;
  ctx.fillRect(0, 0, CFG.W, CFG.H);

  // 柔光斑
  const glow = ctx.createRadialGradient(CFG.W * .22, CFG.H * .78, 10, CFG.W * .22, CFG.H * .78, CFG.W * .55);
  glow.addColorStop(0, 'rgba(125,205,115,.28)');
  glow.addColorStop(1, 'rgba(125,205,115,0)');
  ctx.fillStyle = glow;
  ctx.fillRect(0, 0, CFG.W, CFG.H);

  const glow2 = ctx.createRadialGradient(CFG.W * .85, CFG.H * .3, 10, CFG.W * .85, CFG.H * .3, CFG.W * .5);
  glow2.addColorStop(0, 'rgba(175,230,150,.34)');
  glow2.addColorStop(1, 'rgba(175,230,150,0)');
  ctx.fillStyle = glow2;
  ctx.fillRect(0, 0, CFG.W, CFG.H);

  // 底部草地（金金站在这里，脚部轻微陷进草丛）
  const gy = CFG.groundY;
  const gg = ctx.createLinearGradient(0, gy, 0, CFG.H);
  gg.addColorStop(0, '#b9e3a1');
  gg.addColorStop(.6, '#a6d78d');
  gg.addColorStop(1, '#8fc876');
  ctx.fillStyle = gg;
  ctx.fillRect(0, gy, CFG.W, CFG.H - gy);
  // 草叶
  ctx.fillStyle = 'rgba(140,200,115,.95)';
  for (let x = 6; x < CFG.W; x += 17){
    const h = 5 + ((x * 7) % 5);
    ctx.beginPath();
    ctx.moveTo(x, gy + 1);
    ctx.lineTo(x + 3.5, gy - h);
    ctx.lineTo(x + 7, gy + 1);
    ctx.closePath();
    ctx.fill();
  }
  ctx.fillStyle = 'rgba(255,255,255,.35)';
  ctx.fillRect(0, gy, CFG.W, 2);

  // 罐子边框
  ctx.save();
  roundRect(ctx, CFG.pad - 1, -20, CFG.W - CFG.pad * 2 + 2, CFG.H + 40, 22);
  ctx.strokeStyle = 'rgba(110,175,95,.45)';
  ctx.lineWidth = 3;
  ctx.stroke();
  ctx.restore();
}

function drawGuideLine(){
  if (state !== 'playing') return;
  ctx.save();
  ctx.setLineDash([6, 10]);
  ctx.strokeStyle = 'rgba(110,175,95,.28)';
  ctx.lineWidth = 2;
  ctx.beginPath();
  ctx.moveTo(aimX, CFG.dropY + 26);
  ctx.lineTo(aimX, CFG.groundY - 6);
  ctx.stroke();
  ctx.restore();
}

function drawWarnLine(){
  const danger = dangerFlag;
  ctx.save();
  ctx.setLineDash([11, 9]);
  ctx.lineWidth = danger ? 3 : 2;
  ctx.strokeStyle = danger ? 'rgba(226,74,52,.92)' : 'rgba(240,150,66,.6)';
  ctx.beginPath();
  ctx.moveTo(CFG.pad + 2, CFG.lineY);
  ctx.lineTo(CFG.W - CFG.pad - 2, CFG.lineY);
  ctx.stroke();
  ctx.restore();

  ctx.save();
  ctx.font = '600 11px system-ui, sans-serif';
  ctx.fillStyle = danger ? 'rgba(226,74,52,.95)' : 'rgba(90,160,80,.85)';
  ctx.textBaseline = 'bottom';
  ctx.fillText('警戒线', CFG.pad + 8, CFG.lineY - 4);
  ctx.restore();
}

function drawOne(body){
  const sp = sprites[body.level - 1];
  const popT = body.pop >= 1 ? 1 : easeOutBack(body.pop);
  const scale = 0.35 + 0.65 * popT;
  const DW = body.r * 2 * CFG.spriteW * scale;
  const DH = DW * CFG.spriteAspect;

  ctx.save();
  ctx.translate(body.position.x, body.position.y);
  ctx.rotate(body.angle);

  // Q 弹变形：沿碰撞法线压短、垂直方向鼓出
  const sq = body.squash || 0;
  if (sq > .004 || sq < -.004){
    const rel = (body.squashAng || 0) - body.angle;
    ctx.rotate(rel);
    ctx.scale(1 + sq * .75, 1 - sq * .75);
    ctx.rotate(-rel);
  }

  if (sp){
    // 极淡的深绿投影，让人像在浅绿背景上也能分离出来
    // 人像面积大，阴影一旦重就会在人物四周糊出一圈灰雾，所以调得比水果版轻
    ctx.shadowColor = 'rgba(50,110,45,.16)';
    ctx.shadowBlur = 5;
    ctx.shadowOffsetY = 3;
    ctx.drawImage(sp, -DW/2, -DH/2, DW, DH);
    ctx.shadowColor = 'rgba(0,0,0,0)';
  } else {
    // 图片没加载出来的兜底
    ctx.beginPath();
    ctx.arc(0, 0, body.r, 0, Math.PI * 2);
    ctx.fillStyle = FRUITS[body.level-1].color;
    ctx.fill();
  }
  ctx.restore();
}

function drawHold(){
  if (state !== 'playing') return;
  const lvl = holdLevel;
  const sp = sprites[lvl-1];
  const r = FRUITS[lvl-1].r;
  const DW = r * 2 * CFG.spriteW;
  const DH = DW * CFG.spriteAspect;
  const bob = Math.sin(clock * 3) * 2.2;
  ctx.save();
  ctx.globalAlpha = dropCD > 0 ? .35 : 1;
  ctx.translate(aimX, CFG.dropY + bob);
  if (sp) ctx.drawImage(sp, -DW/2, -DH/2, DW, DH);
  ctx.restore();
}

function drawEffects(){
  for (const p of particles){
    ctx.globalAlpha = Math.max(0, p.life) * .9;
    ctx.fillStyle = p.color;
    ctx.beginPath();
    ctx.arc(p.x, p.y, p.r * p.life, 0, Math.PI * 2);
    ctx.fill();
  }
  ctx.globalAlpha = 1;

  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';
  for (const t of popups){
    const a = Math.min(1, t.life * 1.6);
    ctx.globalAlpha = a;
    ctx.font = '800 20px system-ui, sans-serif';
    ctx.lineWidth = 4;
    ctx.strokeStyle = 'rgba(255,255,255,.9)';
    ctx.strokeText(t.text, t.x, t.y);
    ctx.fillStyle = t.color;
    ctx.fillText(t.text, t.x, t.y);
  }
  ctx.globalAlpha = 1;
  ctx.textAlign = 'start';
  ctx.textBaseline = 'alphabetic';
}

function render(dt){
  drawBackground();
  drawGuideLine();
  drawWarnLine();
  // 贴图比碰撞圆大不少，靠墙的球会把图像探出去（看着像穿模），
  // 这里统一裁到球场范围内，探出去的部分直接裁掉
  ctx.save();
  ctx.beginPath();
  ctx.rect(CFG.pad, 0, CFG.W - CFG.pad * 2, CFG.H);
  ctx.clip();
  // 大的先画、小的后画：贴图互相压得很厉害，按尺寸排序能让小球不被大脸整个吞掉
  const order = [];
  for (const b of fruits.values()) order.push(b);
  order.sort(function(p, q){ return q.r - p.r; });
  for (let i = 0; i < order.length; i++) drawOne(order[i]);
  ctx.restore();
  drawEffects();
  drawHold();
}

/* --------------------------------------------------------------------------
   ⑯  主循环
   -------------------------------------------------------------------------- */
function loop(ts){
  requestAnimationFrame(loop);
  if (!lastTS) lastTS = ts;
  const raw = Math.min(ts - lastTS, 100);
  lastTS = ts;
  const dt = raw / 1000;
  clock += dt;

  if (state === 'playing'){
    dropCD = Math.max(0, dropCD - dt);
    acc += raw;
    let n = 0;
    while (acc >= FIXED && n < 4){
      Matter.Engine.update(engine, FIXED);
      acc -= FIXED;
      n++;
      afterPhysics(FIXED / 1000);
      if (state !== 'playing') break;
    }
    if (n >= 4) acc = 0;
  }

  updateEffects(dt);
  render(dt);
}

/* --------------------------------------------------------------------------
   ⑰  输入（鼠标 + 触屏统一用 Pointer Events）
   -------------------------------------------------------------------------- */
function bindInput(){
  cv.addEventListener('pointerdown', e => {
    if (state !== 'playing') return;
    pointerDown = true;
    setAim(e.clientX);
    e.preventDefault();
  });

  cv.addEventListener('pointermove', e => {
    if (state !== 'playing') return;
    // 鼠标不用按下也能瞄准；触屏必须按住拖动
    if (e.pointerType === 'mouse' || pointerDown) setAim(e.clientX);
  });

  window.addEventListener('pointerup', e => {
    if (!pointerDown) return;
    pointerDown = false;
    if (state !== 'playing') return;
    setAim(e.clientX);
    drop();
  });

  window.addEventListener('pointercancel', () => { pointerDown = false; });

  // 桌面端：鼠标移出画布也不影响下次进入
  cv.addEventListener('contextmenu', e => e.preventDefault());
}

/* --------------------------------------------------------------------------
   ⑱  自适应布局
   -------------------------------------------------------------------------- */
const app = document.getElementById('app');
function layout(){
  const vw = window.innerWidth;
  const vh = window.innerHeight;
  const scale = Math.min(vw / CFG.W, vh / CFG.H) * 0.98;
  app.style.width = Math.floor(CFG.W * scale) + 'px';
  app.style.height = Math.floor(CFG.H * scale) + 'px';
  app.style.fontSize = (16 * scale) + 'px';

  const dpr = Math.min(window.devicePixelRatio || 1, 2);
  const bw = Math.round(CFG.W * dpr);
  const bh = Math.round(CFG.H * dpr);
  if (cv.width !== bw || cv.height !== bh){
    cv.width = bw;
    cv.height = bh;
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  }
}

function bindUI(){
  document.getElementById('btnStart').addEventListener('click', () => {
    // 就算素材还没就绪也要能开始：现场补一次初始化，绝不让按钮变成"死键"
    if (!ready){
      try {
        if (!world) createWorld();
        ready = true;
      } catch (err) { fatal(err); return; }
    }
    hudEl.style.opacity = '1';
    startScreen.classList.add('hidden');
    initSfx();          // 在用户点击的这一刻初始化音频，绕过浏览器的自动播放限制
    resetGame();
  });
  document.getElementById('btnRestart').addEventListener('click', () => {
    resetGame();
  });
  btnRevive.addEventListener('click', () => {
    revive();
  });
  const sBtn = document.getElementById('btnSound');
  if (sBtn){
    sBtn.addEventListener('click', e => {
      e.stopPropagation();
      setSfxOn(!sfxOn);
    });
  }

  // ---- 继续上一局 ----
  const btnResume = document.getElementById('btnResume');
  if (btnResume){
    btnResume.addEventListener('click', () => {
      const d = readSave();
      if (!d){ refreshResumeBtn(); return; }
      if (!ready){
        try { if (!world) createWorld(); ready = true; }
        catch (err) { fatal(err); return; }
      }
      hudEl.style.opacity = '1';
      startScreen.classList.add('hidden');
      initSfx();
      resumeGame(d);
    });
  }

  // ---- 排行榜 ----
  const btnBoard = document.getElementById('btnBoard');
  if (btnBoard) btnBoard.addEventListener('click', () => {
    renderBoard();
    document.getElementById('boardScreen').classList.remove('hidden');
  });
  const btnBoard2 = document.getElementById('btnBoard2');
  if (btnBoard2) btnBoard2.addEventListener('click', () => {
    renderBoard();
    document.getElementById('boardScreen').classList.remove('hidden');
  });
  const btnBoardClose = document.getElementById('btnBoardClose');
  if (btnBoardClose) btnBoardClose.addEventListener('click', () => {
    document.getElementById('boardScreen').classList.add('hidden');
  });

  // ---- 上榜 ----
  const btnSubmit = document.getElementById('btnSubmit');
  if (btnSubmit) btnSubmit.addEventListener('click', () => {
    if (submittedThisRound) return;      // 一次结算只记一条，防止重复点击
    submittedThisRound = true;
    const inp = document.getElementById('nickInput');
    let name = ((inp && inp.value) || '').trim().slice(0, 12);
    if (!name) name = '无名玩家';
    Store.set(NICK_KEY, name);
    addBoardEntry(name, score);
    const nr = document.getElementById('nickRow');
    if (nr) nr.classList.add('hidden');
    if (inp) inp.disabled = true;
    showToast('已记入排行榜');
  });
  const inpNick = document.getElementById('nickInput');
  if (inpNick) inpNick.addEventListener('keydown', e => {
    if (e.key === 'Enter'){ e.preventDefault(); btnSubmit && btnSubmit.click(); }
  });

  // ---- 离开页面时把进度落盘 ----
  const flush = () => saveGame(true);
  window.addEventListener('pagehide', flush);
  window.addEventListener('beforeunload', flush);
  document.addEventListener('visibilitychange', () => { if (document.hidden) flush(); });
  setInterval(() => saveGame(), 3000);   // 兜底

  refreshResumeBtn();   // 有存档才显示"继续上一局"

  window.addEventListener('resize', layout);
  window.addEventListener('orientationchange', () => setTimeout(layout, 120));
}

function boot(){
  try {
    layout();
    // 先把界面和输入绑好：哪怕后面任何一步慢了，按钮也是活的
    bindInput();
    bindUI();

    bestEl.textContent = best;
    hudEl.style.opacity = '0';   // 开始页先把顶栏藏起来
    holdLevel = randLevel();
    nextLevel = randLevel();
    refreshNext();
    refreshCardUI();
    setSfxOn(sfxOn);   // 恢复上次的音效开关状态（图标 + 静音）
    document.getElementById('heroImg').src = HERO_SRC;   // 首页大图用完整半身照
  } catch (err) {
    return fatal(err);
  }

  const btn = document.getElementById('btnStart');
  btn.textContent = '准 备 中…';

  loadImages().then(() => {
    try {
      createWorld();
      ready = true;
      btn.textContent = '开 始 游 戏';
      requestAnimationFrame(loop);
    } catch (err) {
      fatal(err);
    }
  }).catch(fatal);
}

boot();
</script>
</body>
</html>
